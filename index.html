,phase:`theory`,summary:`User များ စကားဝှက် မေ့တတ်သော Mobile App များတွင် Google OAuth နှင့် 6-digit OTP / Magic Link များကို Brute-force မခံရအောင် တည်ဆောက်နည်း။`,sections:[{heading:`၁။ OTP Verification တွင် မရှိမနေ ထည့်ရမည့် စည်းကမ်း ၃ ချက်`,body:`(၁) OTP code ကို ၅ မိနစ်မှ ၁၀ မိနစ်အတွင်း သက်တမ်းကုန် (Expiration) စေရမည်။ (၂) အများဆုံး ၃-၅ ကြိမ် မှားယွင်းရိုက်မိလျှင် ထို OTP ကို ချက်ချင်း invalidate လုပ်ရမည်။ (၃) OTP ကို Database ထဲတွင် Plaintext မသိမ်းဘဲ Hash လုပ်ပြီး သိမ်းရမည်။`}],proTip:{title:`Senior Pro Tip — Constant-Time Comparison သုံးပါ`,content:"OTP သို့မဟုတ် Webhook Signature စစ်ဆေးရာတွင် `===` အစား `crypto.timingSafeEqual` ကို သုံးခြင်းဖြင့် Timing Attack မှ ကာကွယ်နိုင်သည်။"},commonPitfall:`OTP code ကို API response ထဲတွင် debug အဖြစ် ပြန်ထည့်ပေးမိခြင်း သို့မဟုတ် Expiry time မစစ်ဘဲ အမြဲတမ်း သုံးခွင့်ပြုထားခြင်း။`,challenge:{title:`OTP Expiry & Attempt Limit Validator`,instructions:`verifyOtpRecord(record, inputCode, nowMs) function ကို ရေးပါ။ record တွင် { code, expiresAt, attempts } ပါဝင်သည်။ (၁) nowMs > record.expiresAt ဖြစ်လျှင် { valid: false, reason: "expired" }၊ (၂) record.attempts >= 3 ဖြစ်လျှင် { valid: false, reason: "locked" }၊ (၃) code တူလျှင် { valid: true }၊ မတူလျှင် { valid: false, reason: "mismatch" } ပြန်ပေးပါ။`,mode:`js`,starterCode:`function verifyOtpRecord(record, inputCode, nowMs) {
  // TODO: Check expiry, max attempts (3), and code match
  return { valid: false, reason: 'mismatch' };
}`,solutionCode:`function verifyOtpRecord(record, inputCode, nowMs) {
  if (nowMs > record.expiresAt) {
    return { valid: false, reason: 'expired' };
  }
  if (record.attempts >= 3) {
    return { valid: false, reason: 'locked' };
  }
  if (record.code === inputCode) {
    return { valid: true };
  }
  return { valid: false, reason: 'mismatch' };
}`,hint:`expiresAt ကို အရင်စစ်ပါ၊ ထို့နောက် attempts >= 3 စစ်ပါ၊ နောက်ဆုံးမှ record.code === inputCode ကို စစ်ပါ။`,tests:[{id:`otp-exp`,label:`သက်တမ်းကုန် OTP ကို expired ဖြင့် ငြင်းပယ်ခြင်း`,type:`js-assert`,assertionCode:`
                const r = verifyOtpRecord({ code: '123456', expiresAt: 1000, attempts: 0 }, '123456', 2000);
                return r.valid === false && r.reason === 'expired';
              `,failMessage:`nowMs > expiresAt ဖြစ်လျှင် code မှန်နေလျှင်ပင် expired ဖြစ်ရမည်။`},{id:`otp-lock`,label:`၃ ကြိမ်မှားပြီး OTP ကို locked ဖြင့် ပိတ်ခြင်း`,type:`js-assert`,assertionCode:`
                const r = verifyOtpRecord({ code: '123456', expiresAt: 5000, attempts: 3 }, '123456', 2000);
                return r.valid === false && r.reason === 'locked';
              `,failMessage:`attempts >= 3 ဖြစ်လျှင် valid: false, reason: "locked" ပြန်ပေးရမည်။`},{id:`otp-ok`,label:`Valid OTP ကို အတည်ပြုနိုင်ခြင်း`,type:`js-assert`,assertionCode:`
                const r = verifyOtpRecord({ code: '123456', expiresAt: 5000, attempts: 1 }, '123456', 2000);
                return r.valid === true;
              `,failMessage:`သက်တမ်းမကုန်သေးဘဲ attempts < 3 နှင့် code မှန်လျှင် valid: true ဖြစ်ရမည်။`}]}},{id:`l4-m2`,order:2,title:`JWT vs HttpOnly Session Cookies`,englishTopic:`Token Storage & Session Lifecycle`,durationMins:45,phase:`theory`,summary:`JWT (JSON Web Token) ၏ အလုပ်လုပ်ပုံ၊ Access Token & Refresh Token ခွဲသုံးနည်းနှင့် XSS မှ ကာကွယ်ရန် HttpOnly Cookie ကို ရွေးချယ်သင့်ပုံ။`,sections:[{heading:`၁။ JWT ကို localStorage ထဲမှာ မသိမ်းသင့်ဘူးလား?`,body:"localStorage သည် JavaScript ဖြင့် ဖတ်ယူ၍ ရသောကြောင့် သင့် App တွင် XSS vulnerability တစ်ခုရှိပါက Hacker က Token ကို ခိုးယူနိုင်သည်။ Sensitive web app များတွင် Session Token သို့မဟုတ် Refresh Token ကို `HttpOnly; Secure; SameSite=Lax` Cookie ထဲတွင် သိမ်းခြင်းက JavaScript မှ ဖတ်မရအောင် ကာကွယ်ပေးသည်။"}],proTip:{title:`Senior Pro Tip — JWT Payload ထဲတွင် Secret Data မထည့်ပါနှင့်`,content:`JWT Payload သည် Encrypt လုပ်ထားခြင်း မဟုတ်ဘဲ Base64Url Encode သာ လုပ်ထားခြင်း ဖြစ်သည်။ User ID နှင့် Role ကဲ့သို့ မလျှို့ဝှက်သော ID များကိုသာ ထည့်ပါ။ Password, Phone, NRC နံပါတ်များကို ဘယ်တော့မှ မထည့်ပါနှင့်။`},commonPitfall:"JWT ကို Verification (`jwt.verify`) မလုပ်ဘဲ `jwt.decode` ဖြင့်သာ ဖတ်ပြီး User ID ကို ယုံကြည်မိခြင်းကြောင့် Token အတုဖြင့် ဝင်ရောက်ခံရနိုင်သည်။",challenge:{title:`JWT Expiration & Role Claims Checker`,instructions:`isTokenUsable(claims, nowSec) function ကို ရေးပါ။ claims object တွင် sub (string), role (string), exp (number) ပါရှိပြီး sub မပါလျှင်ဖြစ်စေ၊ exp <= nowSec ဖြစ်လျှင်ဖြစ်စေ false ပြန်ပေးပြီး အားလုံးမှန်မှ true ပြန်ပေးပါ။`,mode:`js`,starterCode:`function isTokenUsable(claims, nowSec) {

  if (!claims || typeof claims.sub !== 'string' || !claims.sub) return false;
  if (typeof claims.role !== 'string' || !claims.role) return false;
  if (typeof claims.exp !== 'number' || claims.exp <= nowSec) return false;
  return true;
}`,hint:`claims.sub, claims.role ရှိမရှိနှင့် claims.exp > nowSec ဖြစ်မဖြစ် စစ်ဆေးပါ။`,tests:[{id:`jwt-valid`,label:`သက်တမ်းရှိ Valid Claims ကို true ပြန်ခြင်း`,type:`js-assert`,assertionCode:`return isTokenUsable({ sub: 'u_1', role: 'member', exp: 2000 }, 1500) === true;`,failMessage:`sub, role ပါပြီး exp > nowSec ဖြစ်လျှင် true ဖြစ်ရမည်။`},{id:`jwt-exp`,label:`သက်တမ်းကုန် Token ကို false ပြန်ခြင်း`,type:`js-assert`,assertionCode:`return isTokenUsable({ sub: 'u_1', role: 'member', exp: 1500 }, 1500) === false;`,failMessage:`exp <= nowSec ဖြစ်လျှင် false ပြန်ပေးရမည်။`}]}},{id:`l4-m3`,order:3,title:`Role-Based Access Control (RBAC)`,englishTopic:`Server-Side RBAC & Ownership Checks`,durationMins:45,phase:`coding`,summary:`Admin, Instructor, Member စသည့် Role အလိုက် API နှင့် Data များကို Server-side မှ တင်းကျပ်စွာ ခွင့်ပြုပေးခြင်းနှင့် IDOR (Insecure Direct Object Reference) ကာကွယ်ခြင်း။`,sections:[{heading:`၁။ UI Hide လုပ်ရုံဖြင့် လုံခြုံပြီဟု မယူဆပါနှင့်`,body:'Frontend တွင် Admin Button ကို `user.role === "admin" && <DeleteBtn />` ဖြင့် ဖျောက်ထားရုံမျှဖြင့် မလုံလောက်ပါ။ Attacker သည် curl/Postman ဖြင့် `DELETE /api/users/42` ကို တိုက်ရိုက်ခေါ်နိုင်သောကြောင့် Backend Middleware တွင် Role နှင့် Resource Ownership ကို မဖြစ်မနေ ထပ်စစ်ရမည်။'}],proTip:{title:`Senior Pro Tip — Default Deny Policy ကို ကျင့်သုံးပါ`,content:`Permission system ရေးရာတွင် "ခွင့်မပြုထားသမျှ အားလုံးကို ပိတ်ထားမည် (Deny by default)" မူဝါဒကို သုံးပါ။ Role matrix ထဲတွင် တိတိကျကျ ခွင့်ပြုထားသော permission ရှိမှသာ ဝင်ခွင့်ပေးပါ။`},commonPitfall:"User က `/api/orders/99` ကို တောင်းသည့်အခါ Login ဝင်ထားခြင်း (Authentication) ကိုသာ စစ်ပြီး ထို Order 99 သည် ထို User ပိုင်ဆိုင်ခြင်း ဟုတ်မဟုတ် (Authorization / Ownership) ကို မစစ်မိခြင်း။",challenge:{title:`RBAC & Resource Ownership Guard`,instructions:`canModifyOrder(user, order) function ကို ရေးပါ။ user.role === "admin" ဖြစ်လျှင်ဖြစ်စေ၊ user.id === order.ownerId ဖြစ်လျှင်ဖြစ်စေ true ပြန်ပေးပြီး အခြားအခြေအနေများတွင် false ပြန်ပေးပါ။`,mode:`js`,starterCode:`function canModifyOrder(user, order) {
  // TODO: Allow only admin or order owner
  return false;
}`,solutionCode:`function canModifyOrder(user, order) {

  if (user.role === 'admin') return true;

);`}],proTip:{title:`Senior Pro Tip — Dynamic ORDER BY Column များကို Allowlist ဖြင့် စစ်ပါ`,content:'SQL parameter (`$1`) သည် Column name သို့မဟုတ် `ASC/DESC` နေရာတွင် သုံး၍မရပါ။ User ပို့သော sort field ကို `const allowed = ["created_at", "price"];` array ထဲတွင် ပါမပါ Allowlist စစ်ပြီးမှ Query ထဲ ထည့်ပါ။'},commonPitfall:"ORM (Prisma/Drizzle) သုံးနေသော်လည်း Raw SQL query (`$queryRawUnsafe`) ထဲတွင် template interpolation သုံးမိခြင်း။",challenge:{title:`Safe Sort Column Allowlist Builder`,instructions:`buildSafeOrderBy(sortField, direction) function ကို ရေးပါ။ sortField သည် ["created_at", "price", "name"] ထဲတွင် ပါမှသာ သုံးပြီး မပါလျှင် "created_at" သုံးပါ။ direction သည် "ASC" ဖြစ်မှ "ASC" သုံးပြီး ကျန်တာကို "DESC" ပြန်ပေးပါ။`,mode:`js`,starterCode:"function buildSafeOrderBy(sortField, direction) {\n  // TODO: Whitelist column and direction to prevent SQL Injection\n  return `ORDER BY ${sortField} ${direction}`;\n}",solutionCode:`function buildSafeOrderBy(sortField, direction) {

  // 1. Check CORS origin against ALLOWED_ORIGINS
  // 2. Validate & sanitize req.body.text

gnature စစ်ဆေးပြီးမှ Entitlement ဖွင့်ပေးနည်း။`,sections:[{heading:`၁။ ဘာကြောင့် Success URL Redirect ကို မယုံသင့်သနည်း?`,body:"User တစ်ဦးသည် Browser address bar တွင် `/payment-success?plan=pro` ဟု ကိုယ်တိုင်ရိုက်ပြီး ဝင်နိုင်သလို ငွေပေးချေပြီးနောက် Internet ပြတ်သွား၍ Success page သို့ ပြန်မရောက်နိုင်ခြင်းလည်း ဖြစ်တတ်သည်။ Payment Gateway မှ Server သို့ တိုက်ရိုက်ပို့သော Webhook ကို Secret Signature စစ်ဆေးပြီးမှ Database ကို Update လုပ်ရမည်။"}],proTip:{title:`Senior Pro Tip — Webhook Raw Body ကို ထိန်းသိမ်းပါ`,content:'Stripe/Payment Webhook HMAC signature စစ်ဆေးရာတွင် Express `express.json()` က parse လုပ်ပြီးသား Object ကို သုံးလျှင် Signature verification ကျရှုံးတတ်သည်။ Webhook route အတွက် `express.raw({ type: "application/json" })` ကို သီးသန့်သုံးပါ။'},commonPitfall:"Webhook signature မစစ်ဆေးဘဲ `POST /api/webhooks/payment` ကို ဖွင့်ထားခြင်းကြောင့် မည်သူမဆို curl ဖြင့် Pro Plan ကို အခမဲ့ ဖွင့်ယူနိုင်ခြင်း။",challenge:{title:`Subscription Entitlement Evaluator`,instructions:`hasPremiumAccess(subscription, nowMs) function ကို ရေးပါ။ status သည် "active" သို့မဟုတ် "trialing" ဖြစ်ပြီး currentPeriodEnd > nowMs ဖြစ်မှသာ true ပြန်ပေးပါ (past_due သို့မဟုတ် expired ဖြစ်လျှင် false)။`,mode:`js`,starterCode:`function hasPremiumAccess(subscription, nowMs) {
  // TODO: Grant access only if active/trialing and period not expired
  return false;
}`,solutionCode:`function hasPremiumAccess(subscription, nowMs) {
  if (!subscription) return false;
  const activeStatuses = ['active', 'trialing'];
  return (
    activeStatuses.includes(subscription.status) &&

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #020617; color: #f1f5f9; }
  .min-h-dvh { min-height: 100%; }
  .bg-slate-950 { background-color: #020617; }
  .bg-slate-900 { background-color: #0f172a; }
  .bg-slate-800 { background-color: #1e293b; }
  .bg-sky-500 { background-color: #0ea5e9; }
  .text-white, .text-slate-100 { color: #f8fafc; }
  .text-slate-300 { color: #cbd5e1; }
  .text-slate-400 { color: #94a3b8; }
  .text-slate-950 { color: #020617; }
  .text-sky-400 { color: #38bdf8; }
  .p-4 { padding: 16px; }
  .px-3 { padding-left: 12px; padding-right: 12px; }
  .px-4 { padding-left: 16px; padding-right: 16px; }
  .py-1 { padding-top: 4px; padding-bottom: 4px; }
  .py-2 { padding-top: 8px; padding-bottom: 8px; }
  .mb-3 { margin-bottom: 12px; }
  .mb-4 { margin-bottom: 16px; }
  .pb-20 { padding-bottom: 80px; }
  .pb-24 { padding-bottom: 96px; }
  .rounded-lg { border-radius: 8px; }
  .font-bold { font-weight: 700; }
  .font-semibold { font-weight: 600; }
  .text-lg { font-size: 18px; }
  .text-base { font-size: 16px; }
  .text-sm { font-size: 14px; }
  .text-xs { font-size: 12px; }
  .grid { display: grid; }
  .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
  .gap-3 { gap: 12px; }
  .flex { display: flex; }
  .justify-around { justify-content: space-around; }
  .fixed { position: fixed; }
  .bottom-0 { bottom: 0; }
  .left-0 { left: 0; }
  .right-0 { right: 0; }
  .border-t { border-top: 1px solid #1e293b; }
  .border-slate-800 { border-color: #1e293b; }
  .min-h-\\[44px\\] { min-height: 44px; }
